<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176f63"><link rel="manifest" href="manifest.webmanifest"><title>예약오픈 알리미</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f6;color:#142d29;margin:0}main{max-width:720px;margin:auto;padding:20px}h1{font-size:24px}.card{background:white;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0001}label{display:block;font-size:13px;margin:10px 0 4px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bacbc7;border-radius:8px;font-size:16px}button,a.btn{border:0;background:#176f63;color:white;padding:11px 15px;border-radius:9px;margin:8px 5px 0 0;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e3efeb;color:#16483f}small,.muted{color:#596c68}pre{white-space:pre-wrap;word-break:break-word}#notice{padding:12px;border-radius:10px;background:#fff4d9}</style></head><body><main><h1>예약오픈 알리미</h1><p class="muted">최대 5개 예약 사이트 · 날짜별 상태 확인</p><div id="notice">이 화면만으로는 카카오 예약 달력을 자동 판독할 수 없습니다. GitHub Actions 감시기를 연결한 뒤 검증된 결과만 표시합니다.</div><section class="card"><b>감시 설정</b><div id="sites"></div><button id="add">+ 사이트 추가</button><button class="secondary" id="export">설정 JSON 복사</button><p><small>설정은 이 휴대전화에 저장됩니다. 자동 감시에 반영하려면 복사한 JSON을 저장소의 <code>sites.json</code>에 붙여 넣으세요.</small></p></section><section class="card"><b>서버 감시 결과</b><p id="updated" class="muted">아직 확인 결과 없음</p><div id="results"></div><button class="secondary" id="refresh">결과 새로고침</button></section><section class="card"><b>수동 확인</b><p class="muted">자동 판독이 불가능한 사이트는 예약 페이지를 직접 열어 확인하세요.</p><div id="links"></div></section></main><script>
const KEY='reservation_watch_sites_v1';let sites;try{sites=JSON.parse(localStorage.getItem(KEY))||[]}catch{sites=[]}if(!sites.length)sites=[{name:'재인폭포파크골프장',url:'https://booking.kakao.com/detail/ticketStore/72866',date:'2026-11-14',enabled:true}];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(sites));render()}function render(){document.getElementById('sites').innerHTML=sites.map((s,i)=>`<div class="card"><b>사이트 ${i+1}</b><label>이름</label><input data-i="${i}" data-k="name" value="${esc(s.name)}"><label>예약 URL</label><input data-i="${i}" data-k="url" value="${esc(s.url)}"><label>감시 날짜</label><input type="date" data-i="${i}" data-k="date" value="${esc(s.date)}"><label><input type="checkbox" style="width:auto" data-i="${i}" data-k="enabled" ${s.enabled?'checked':''}> 감시 사용</label><button class="secondary" data-del="${i}">삭제</button></div>`).join('');document.getElementById('links').innerHTML=sites.filter(s=>/^https:\/\//.test(s.url)).map(s=>`<a class="btn" target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.name||'예약 페이지')} 열기</a>`).join('');document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('change',()=>{sites[+el.dataset.i][el.dataset.k]=el.type==='checkbox'?el.checked:el.value;save()}));document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{sites.splice(+el.dataset.del,1);save()}))}document.getElementById('add').onclick=()=>{if(sites.length>=5)return alert('최대 5개까지 등록할 수 있습니다.');sites.push({name:'',url:'',date:'',enabled:true});save()};document.getElementById('export').onclick=async()=>{const v=JSON.stringify(sites,null,2);try{await navigator.clipboard.writeText(v);alert('설정 JSON을 복사했습니다.')}catch{prompt('설정 JSON을 복사하세요',v)}};async function refresh(){try{let r=await fetch('data/status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('상태 파일 없음');let j=await r.json();document.getElementById('updated').textContent='마지막 실행: '+(j.checked_at||'알 수 없음');document.getElementById('results').innerHTML=(j.results||[]).map(x=>`<div class="card"><b>${esc(x.name)}</b> · ${esc(x.date)}<p>${esc(x.status)} — ${esc(x.reason)}</p></div>`).join('')||'검사 결과 없음'}catch(e){document.getElementById('updated').textContent='아직 자동 감시 결과가 없습니다. GitHub Actions 설정을 확인하세요.'}}document.getElementById('refresh').onclick=refresh;render();refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
